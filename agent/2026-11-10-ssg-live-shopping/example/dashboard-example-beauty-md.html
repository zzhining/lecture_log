 <div class="note">'신규' = 전년 방송 이력 없음 · '전년 동기 미방송' = 전년 같은 기간 방송 없음 · 전년비는 전년 같은 월 같은 날짜까지</div></div></details>`}
/* ---------- ⑥ 상세 실적표 (원본 실적현황) ---------- */
const METS=[['취급액','취급액','m'],['이익액','이익액','m'],['한계이익액','한계이익액','m'],['편성비중','편성비중','p'],['시간당한계이익','시간당한계이익','m'],['취급액달성율','취급 달성율','p'],['순주문달성율','순주문 달성율','p'],['실질이익달성율','실질이익 달성율','p'],['연간진척율','연간 진척율','p'],['취급액전년비','취급 전년비','g'],['이익액전년비','이익 전년비','g']];
const CATMETS=METS.filter(m=>!/달성율|진척율/.test(m[0]));
const fmt=(v,t)=>{if(v==null)return '–';if(t==='m')return (v/1e6).toLocaleString('ko-KR',{maximumFractionDigits:v/1e6<100?1:0});if(t==='p')return (v*100).toFixed(1)+'%';return GR(v)};
const vcols=()=>P.cols.filter(c=>c.kind!=='주차'||st.open.has(c.month));
function dhead(){const cols=vcols();let r1='<tr><th class="l" rowspan="2"></th>',r2='<tr>';const by={};cols.forEach(c=>{const k=c.month||'Y';(by[k]=by[k]||[]).push(c)});
 Object.keys(by).forEach(k=>{const cs=by[k];if(k==='Y'){r1+='<th rowspan="2" style="background:var(--hl)">연누계</th>';return}const op=st.open.has(k);r1+=`<th colspan="${cs.length}" class="mh" data-m="${k}" style="text-align:center">${op?'▾':'▸'} ${+k.slice(5)}월</th>`;
  cs.forEach(c=>r2+=c.kind==='주차'?`<th>${c.week}주${c.live==='Y'?' <span style="color:var(--warn)">진행</span>':''}<br><span style="font-weight:500">${c.s.slice(5).replace('-','/')}~${c.e.slice(5).replace('-','/')}</span></th>`:`<th style="background:var(--soft);color:var(--ink)">${+k.slice(5)}월 누계</th>`)});return r1+'</tr>'+r2+'</tr>'}
function dcells(o,met,t,heat){return vcols().map(c=>{const v=g(o,c.id,met);let sty=c.kind==='연누계'?'background:var(--hl);font-weight:700;':c.kind==='월누계'?'font-weight:700;':'';
 if(heat&&v!=null&&heat[c.id]>0&&v>0){const a=Math.min(1,v/heat[c.id]);sty+=`background:color-mix(in srgb,var(--k1) ${Math.round(6+a*40)}%,transparent);`}
 let ex='';if(met==='취급액'&&c.kind!=='주차'){const a=g(o,c.id,'취급액달성율');if(a!=null)ex=`<br><span class="mu" style="font-size:11px">${PC(a)}</span>`}
 return `<td style="${sty}">${fmt(v,t)}${ex}</td>`}).join('')}
function renderDetail(){const sw=`<div class="ctrl"><span class="lb">표</span>${[['md','MD별 실적'],['cat','CAT별 실적']].map(x=>`<button class="chip ${st.dt===x[0]?'on':''}" data-dt="${x[0]}">${x[1]}</button>`).join('')}<span class="lb" style="margin-left:12px">월 머리글을 누르면 주차가 펼쳐짐</span><button class="chip" data-mall="1" style="margin-left:auto">모든 월 펼치기</button><button class="chip" data-mall="0">모두 접기</button></div>`;
 let b='';if(st.dt==='md'){P.mds.forEach(m=>{const tot=m==='뷰티 합계',has=!!P.md[m];if(!mine(m)&&!tot)return;b+=`<tr class="${has?'clk':''} ${tot?'tot':''} ${st.md===m?'me':''}" data-exp="${has?m:''}"><td class="l">${has?(st.exp.has(m)?'▾ ':'▸ '):''}${m}${has?'':' <span class="tag t-n">올해 담당 방송 없음</span>'}</td>${has?dcells(P.md[m],'취급액','m'):vcols().map(()=>'<td></td>').join('')}</tr>`;
  if(st.exp.has(m))METS.slice(1).forEach(x=>b+=`<tr class="sub"><td class="l">${x[1]}</td>${dcells(P.md[m],x[0],x[2])}</tr>`)});
  return sw+`<div class="card"><h2>MD별 실적</h2><p class="d">기본 행 = 취급액(누계 칸 아래 숫자 = 취급 달성율) · 이름을 누르면 나머지 10개 지표가 펼쳐짐 · 금액 백만 원</p><div class="scroll"><table class="stick"><thead>${dhead()}</thead><tbody>${b}</tbody></table></div></div>`}
 const met=st.met,t=CATMETS.find(m=>m[0]===met)[2],heatOn=t!=='g';const mxBy=keys=>{const h={};P.cols.forEach(c=>{h[c.id]=Math.max(0,...keys.map(k=>g(P.cat[k],c.id,met)||0))});return h};const hc=heatOn?mxBy(P.cats.map(c=>c+'|')):null;
 P.cats.forEach(c=>{const k='c:'+c;b+=`<tr class="clk" data-exp="${k}"><td class="l">${st.exp.has(k)?'▾ ':'▸ '}${c}</td>${dcells(P.cat[c+'|'],met,t,hc)}</tr>`;if(st.exp.has(k)){const ks=P.sub[c].map(s=>c+'|'+s).filter(x=>P.cat[x]);const hs=heatOn?mxBy(ks):null;ks.forEach(x=>b+=`<tr class="sub"><td class="l">${x.split('|')[1]}</td>${dcells(P.cat[x],met,t,hs)}</tr>`)}});
 b+=`<tr class="tot"><td class="l">뷰티 합계</td>${dcells(T,met,t)}</tr>`;
 return sw+`<div class="card"><h2>CAT별 실적 히트맵</h2><p class="d">색이 진할수록 같은 열 안에서 값이 큼(CAT끼리, 세부 CAT은 같은 CAT 안에서 비교) · 전년비 지표는 색 없음</p><div class="ctrl"><span class="lb">지표</span>${CATMETS.map(m=>`<button class="chip ${st.met===m[0]?'on':''}" data-met="${m[0]}">${m[1]}</button>`).join('')}</div><div class="scroll"><table class="stick heat"><thead>${dhead()}</thead><tbody>${b}</tbody></table></div></div>`}
/* ---------- render & events ---------- */
function render(){header();const f={brief:renderBrief,md:renderMD,cat:renderCAT,mkt:renderMkt,brand:renderBrand,detail:renderDetail}[st.tab];$('#view').innerHTML=f();tip.style.display='none'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-md],[data-qp],[data-cat],[data-catall],[data-dt],[data-met],[data-m],[data-mall],[data-exp]');if(!t)return;const d=t.dataset;
 if(d.tab){st.tab=d.tab;scrollTo(0,0)}else if(d.md){st.md=st.md===d.md&&d.md!=='전체'?'전체':d.md}else if(d.qp)st.qp=d.qp;
 else if(d.cat){st.catOpen.has(d.cat)?st.catOpen.delete(d.cat):st.catOpen.add(d.cat)}else if(d.catall!=null){d.catall==='1'?W.T2.forEach(c=>st.catOpen.add(c.name)):st.catOpen.clear()}
 else if(d.dt)st.dt=d.dt;else if(d.met)st.met=d.met;else if(d.m){st.open.has(d.m)?st.open.delete(d.m):st.open.add(d.m)}
 else if(d.mall!=null){if(d.mall==='1')P.cols.forEach(c=>c.month&&st.open.add(c.month));else st.open.clear()}
 else if(d.exp){st.exp.has(d.exp)?st.exp.delete(d.exp):st.exp.add(d.exp)}else return;render()});
document.addEventListener('change',e=>{if(e.target.id==='bsel'){st.bm=+e.target.value;render()}});
render();
</script>
</body>
