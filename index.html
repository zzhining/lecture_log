<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Log</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1f2328; --muted:#6b7280; --card:#fff; --line:#e5e7eb; --accent:#2563eb; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#e6e8eb; --muted:#9aa1ab; --card:#1f2229; --line:#2e323b; --accent:#6ea8fe; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  header { padding:2rem 1rem 1rem; max-width:960px; margin:0 auto; }
  h1 { margin:0; font-size:1.6rem; }
  .sub { color:var(--muted); margin:.25rem 0 0; }
  nav { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); z-index:1; }
  .tabs { max-width:960px; margin:0 auto; padding:.5rem 1rem; display:flex; gap:.5rem; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:.4rem .9rem; border-radius:999px; cursor:pointer; font:inherit; }
  .tabs button[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tabs .n { opacity:.7; font-size:.85em; margin-left:.3em; }
  main { max-width:960px; margin:0 auto; padding:1rem; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:.6rem; }
  li a { display:block; padding:.9rem 1rem; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--fg); text-decoration:none; }
  li a:hover { border-color:var(--accent); }
  li small { display:block; color:var(--muted); font-size:.8rem; word-break:break-all; }
  .msg { color:var(--muted); padding:2rem 0; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Study Log</h1>
  <p class="sub">폴더(메뉴)를 선택하고 자료를 열어보세요.</p>
</header>
<nav><div class="tabs" id="tabs" role="tablist"></div></nav>
<main><ul id="list"></ul><p class="msg" id="msg">불러오는 중…</p></main>
<script>
(async () => {
  const tabs = document.getElementById('tabs'), list = document.getElementById('list'), msg = document.getElementById('msg');
  let cats;
  try {
    const r = await fetch('pages.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    cats = (await r.json()).categories;
  } catch (e) {
    msg.textContent = 'pages.json 을 불러오지 못했습니다. (로컬에서는 python -m http.server 로 열어주세요)';
    return;
  }
  if (!cats.length) { msg.textContent = '표시할 문서가 없습니다.'; return; }
  msg.hidden = true;

  const show = (id) => {
    const cat = cats.find(c => c.id === id) || cats[0];
    tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === cat.id));
    list.replaceChildren(...cat.pages.map(p => {
      const li = document.createElement('li'), a = document.createElement('a'), s = document.createElement('small');
      a.href = encodeURI(p.path); a.textContent = p.title; s.textContent = p.path;
      a.append(s); li.append(a); return li;
    }));
    history.replaceState(null, '', '#' + cat.id);
  };
  cats.forEach(c => {
    const b = document.createElement('button');
    b.dataset.id = c.id; b.setAttribute('role', 'tab');
    b.append(c.name);
    const n = document.createElement('span'); n.className = 'n'; n.textContent = c.pages.length; b.append(n);
    b.onclick = () => show(c.id);
    tabs.append(b);
  });
  show(decodeURIComponent(location.hash.slice(1)));
})();
</script>
</body>
</html>
